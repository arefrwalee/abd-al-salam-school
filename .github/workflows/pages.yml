# نشر وضع العرض (Live Demo) على GitHub Pages
# ينشر مجلد public فقط. لا يوجد خادم هنا، لذلك يعمل النظام تلقائيًا في «وضع العرض»
# ببيانات تجريبية في الذاكرة لا تُحفظ.
name: Deploy live demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
